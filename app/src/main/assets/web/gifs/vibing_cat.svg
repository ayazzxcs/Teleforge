<svg xmlns=http://www.w3.org/2000/svg viewBox=0 0 128 128 width=128 height=128>
  <rect width=128 height=128 rx=20 fill=#1E293B/>
  <g transform-origin=64 90>
    <animateTransform attributeName=transform type=rotate values=0; 12; 0; -12; 0 dur=0.8s repeatCount=indefinite/>
    <!-- Cat Ears -->
    <polygon points=36,36 24,62 52,56 fill=#94A3B8/>
    <polygon points=36,40 28,58 48,54 fill=#F472B6/>
    <polygon points=92,36 76,56 104,62 fill=#94A3B8/>
    <polygon points=92,40 80,54 100,58 fill=#F472B6/>
    <!-- Head -->
    <circle cx=64 cy=70 r=32 fill=#CBD5E1/>
    <!-- Closed Happy Eyes -->
    <path d=M 46 66 Q 52 60 58 66 stroke=#0F172A stroke-width=3 fill=none stroke-linecap=round/>
    <path d=M 70 66 Q 76 60 82 66 stroke=#0F172A stroke-width=3 fill=none stroke-linecap=round/>
    <!-- Nose & Mouth -->
    <polygon points=64,72 61,75 67,75 fill=#EC4899/>
    <!-- Cheeks -->
    <circle cx=42 cy=74 r=5 fill=#F43F5E opacity=0.6/>
    <circle cx=86 cy=74 r=5 fill=#F43F5E opacity=0.6/>
    <!-- Music note floating -->
    <text x=96 y=44 font-size=20 fill=#38BDF8>♪
      <animate attributeName=y values=44; 32; 44 dur=0.8s repeatCount=indefinite/>
      <animate attributeName=opacity values=0.4; 1; 0.4 dur=0.8s repeatCount=indefinite/>
    </text>
  </g>
</svg>
