<svg xmlns=http://www.w3.org/2000/svg viewBox=0 0 128 128 width=128 height=128>
  <rect width=128 height=128 rx=20 fill=#18181B/>
  <g transform-origin=64 64>
    <animateTransform attributeName=transform type=translate values=0,0; 0,-6; 0,0; 0,6; 0,0 dur=0.4s repeatCount=indefinite/>
    <circle cx=64 cy=64 r=42 fill=#FACC15/>
    <!-- Squinting laughing eyes -->
    <path d=M 40 52 L 54 60 L 40 68 stroke=#18181B stroke-width=5 fill=none stroke-linecap=round stroke-linejoin=round/>
    <path d=M 88 52 L 74 60 L 88 68 stroke=#18181B stroke-width=5 fill=none stroke-linecap=round stroke-linejoin=round/>
    <!-- Big Laughing Mouth -->
    <path d=M 42 74 Q 64 104 86 74 Z fill=#713F12/>
    <path d=M 48 76 Q 64 94 80 76 fill=#DC2626/>
    <!-- Tears of Joy -->
    <path d=M 28 62 C 28 54 36 54 36 62 C 36 70 28 74 28 62 Z fill=#38BDF8>
      <animate attributeName=opacity values=0.6; 1; 0.6 dur=0.4s repeatCount=indefinite/>
    </path>
    <path d=M 100 62 C 100 54 92 54 92 62 C 92 70 100 74 100 62 Z fill=#38BDF8>
      <animate attributeName=opacity values=0.6; 1; 0.6 dur=0.4s repeatCount=indefinite/>
    </path>
  </g>
</svg>
