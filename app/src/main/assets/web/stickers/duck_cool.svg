<svg xmlns=http://www.w3.org/2000/svg viewBox=0 0 128 128 width=128 height=128>
  <defs>
    <radialGradient id=duckGrad cx=40% cy=35% r=65%>
      <stop offset=0% stop-color=#FFF176/><stop offset=70% stop-color=#FDD835/><stop offset=100% stop-color=#FBC02D/>
    </radialGradient>
    <radialGradient id=beakGrad cx=30% cy=30% r=70%>
      <stop offset=0% stop-color=#FFA726/><stop offset=100% stop-color=#F57C00/>
    </radialGradient>
    <filter id=shadow x=-10% y=-10% width=120% height=120%>
      <feDropShadow dx=0 dy=4 stdDeviation=4 flood-color=#000 flood-opacity=0.25/>
    </filter>
  </defs>
  <g filter=url(#shadow)>
    <ellipse cx=64 cy=76 rx=42 ry=38 fill=url(#duckGrad)/>
    <circle cx=64 cy=42 r=30 fill=url(#duckGrad)/>
    <!-- Sunglasses -->
    <path d=M 36 34 L 62 34 L 58 48 L 40 48 Z fill=#212121/>
    <path d=M 66 34 L 92 34 L 88 48 L 70 48 Z fill=#212121/>
    <line x1=60 y1=38 x2=68 y2=38 stroke=#212121 stroke-width=4/>
    <line x1=30 y1=36 x2=38 y2=36 stroke=#212121 stroke-width=3/>
    <line x1=90 y1=36 x2=98 y2=36 stroke=#212121 stroke-width=3/>
    <!-- Lens reflection -->
    <line x1=42 y1=38 x2=48 y2=44 stroke=#90CAF9 stroke-width=2/>
    <line x1=72 y1=38 x2=78 y2=44 stroke=#90CAF9 stroke-width=2/>
    <!-- Smirk Beak -->
    <path d=M 54 48 Q 64 45 74 48 Q 68 60 54 48 Z fill=url(#beakGrad)/>
    <!-- Wings folded -->
    <path d=M 38 62 C 22 68 28 88 48 80 Z fill=url(#duckGrad)/>
    <path d=M 90 62 C 106 68 100 88 80 80 Z fill=url(#duckGrad)/>
  </g>
</svg>
