<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <rect width="160" height="160" rx="16" fill="#4C1D95"/>
  <g transform="translate(80, 85)">
    <animateTransform attributeName="transform" type="rotate" values="-12; 12; -12" dur="0.5s" repeatCount="indefinite"/>
    <text x="-32" y="15" font-size="54">🕺</text>
  </g>
  <circle cx="30" cy="30" r="5" fill="#F43F5E">
    <animate attributeName="opacity" values="0.2; 1; 0.2" dur="0.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="130" cy="40" r="6" fill="#FBBF24">
    <animate attributeName="opacity" values="1; 0.2; 1" dur="0.8s" repeatCount="indefinite"/>
  </circle>
  <text x="80" y="145" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#DDD6FE">PARTY TIME</text>
</svg>