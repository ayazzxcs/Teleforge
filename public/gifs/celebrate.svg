<svg xmlns=http://www.w3.org/2000/svg viewBox=0 0 128 128 width=128 height=128>
  <rect width=128 height=128 rx=20 fill=#311B92/>
  <!-- Confetti particles -->
  <circle cx=34 cy=34 r=5 fill=#FFEB3B>
    <animate attributeName=cy values=34; 20; 34 dur=1s repeatCount=indefinite/>
  </circle>
  <rect x=88 y=24 width=8 height=8 fill=#00E676 transform=rotate(25 92 28)>
    <animateTransform attributeName=transform type=rotate values=0 92 28; 360 92 28 dur=1.2s repeatCount=indefinite/>
  </rect>
  <circle cx=24 cy=80 r=4 fill=#FF4081>
    <animate attributeName=cx values=24; 14; 24 dur=1.1s repeatCount=indefinite/>
  </circle>
  <rect x=96 y=74 width=7 height=7 fill=#00B0FF>
    <animate attributeName=y values=74; 64; 74 dur=0.9s repeatCount=indefinite/>
  </rect>
  <!-- Party Popper Center -->
  <g transform-origin=64 74>
    <animateTransform attributeName=transform type=scale values=1; 1.15; 1 dur=0.6s repeatCount=indefinite/>
    <polygon points=40,96 88,96 64,48 fill=#FFC107/>
    <polygon points=46,96 82,96 64,54 fill=#FF9800/>
    <circle cx=64 cy=46 r=14 fill=#E91E63/>
    <circle cx=64 cy=46 r=8 fill=#FFF/>
  </g>
</svg>
