<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <rect width="160" height="160" rx="16" fill="#1E293B"/>
  <g transform="translate(80, 90)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0; 15; -10; 0" dur="0.6s" repeatCount="indefinite"/>
      <text x="-40" y="10" font-size="54">👏</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="scale" values="1; 1.15; 1" dur="0.6s" repeatCount="indefinite"/>
      <circle cx="20" cy="-30" r="4" fill="#FBBF24"/>
      <circle cx="-30" cy="-40" r="5" fill="#EF4444"/>
      <circle cx="0" cy="-45" r="3" fill="#38BDF8"/>
    </g>
  </g>
  <text x="80" y="145" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#94A3B8">CLAP CLAP</text>
</svg>