<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <rect width="160" height="160" rx="16" fill="#0F172A"/>
  <g transform="translate(80, 80)">
    <animateTransform attributeName="transform" type="translate" values="80,78; 80,84; 80,78" dur="0.7s" repeatCount="indefinite"/>
    <text x="-30" y="15" font-size="54">😭</text>
  </g>
  <line x1="60" y1="90" x2="60" y2="135" stroke="#38BDF8" stroke-width="4" stroke-linecap="round">
    <animate attributeName="y2" values="100; 135; 100" dur="0.5s" repeatCount="indefinite"/>
  </line>
  <line x1="100" y1="90" x2="100" y2="135" stroke="#38BDF8" stroke-width="4" stroke-linecap="round">
    <animate attributeName="y2" values="100; 135; 100" dur="0.5s" repeatCount="indefinite" begin="0.2s"/>
  </line>
  <text x="80" y="148" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#94A3B8">SO SAD</text>
</svg>