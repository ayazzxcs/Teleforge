<svg xmlns=http://www.w3.org/2000/svg viewBox=0 0 128 128 width=128 height=128>
  <defs>
    <radialGradient id=handGrad cx=30% cy=30% r=70%>
      <stop offset=0% stop-color=#FFD54F/><stop offset=80% stop-color=#FFA000/><stop offset=100% stop-color=#FF8F00/>
    </radialGradient>
    <filter id=shadow x=-10% y=-10% width=120% height=120%>
      <feDropShadow dx=0 dy=4 stdDeviation=4 flood-color=#000 flood-opacity=0.25/>
    </filter>
  </defs>
  <g filter=url(#shadow)>
    <!-- Palm and Fingers -->
    <rect x=36 y=56 width=56 height=52 rx=16 fill=url(#handGrad)/>
    <path d=M 72 56 L 72 26 C 72 16 54 16 54 28 L 54 56 Z fill=url(#handGrad)/>
    <!-- Finger dividers -->
    <line x1=92 y1=70 x2=68 y2=70 stroke=#FF6F00 stroke-width=3 stroke-linecap=round/>
    <line x1=92 y1=84 x2=68 y2=84 stroke=#FF6F00 stroke-width=3 stroke-linecap=round/>
    <line x1=92 y1=96 x2=68 y2=96 stroke=#FF6F00 stroke-width=3 stroke-linecap=round/>
    <!-- Cuff -->
    <rect x=24 y=66 width=16 height=34 rx=6 fill=#1E88E5/>
  </g>
</svg>
